area: secrets
title: Secrets, configuration and logging
order: 4
items:
  - id: secrets-config-files
    title: No secrets in configuration files, infrastructure code or Terraform state in the repository
    severity: critical
    why: The scan finds known key formats in code and history. Database passwords and custom keys in config files, compose files, Kubernetes manifests and Terraform state often have no recognisable format, and everyone with the repository can read them.
    look_for:
      - 'config/production.json, application.properties / application.yml, settings.py, appsettings.json, docker-compose*.yml environment blocks, Helm values, Kubernetes Secret manifests (base64 is not encryption).'
      - 'terraform.tfstate, *.tfvars and .terraform folders committed; state stored locally instead of in an encrypted backend.'
      - Connection strings with a password (postgres://user:pass@...), and keys named password, secret, token, api_key with literal values.
    fail_if: A real credential is in any committed file, including config and infrastructure files, or Terraform state is committed.
    pass_if: Committed files only reference secrets (environment variables, secret manager paths), and Terraform state lives in an encrypted remote backend.
    evidence: The list of config and infrastructure files reviewed and where each secret is loaded from.
    fix: Move values to a secret manager or the platform's encrypted variables, rotate anything that was committed, and add state files to .gitignore.
    source_url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    automated_by: [code-secrets-working-tree, code-secrets-history, code-env-files-tracked, code-env-not-ignored]

  - id: secrets-client-bundle
    title: No secrets in code that ships to the browser or a mobile app
    severity: critical
    applies_if: The project has a web frontend or a mobile app
    why: Everything in a frontend bundle or app package is public. Build tools copy variables with certain prefixes into the bundle, so a server key put there is published to every visitor.
    look_for:
      - 'Public env prefixes: NEXT_PUBLIC_, VITE_, REACT_APP_, NUXT_PUBLIC_, EXPO_PUBLIC_, and Angular environment.ts files; check that none holds a secret key (Stripe sk_, Supabase service_role, Firebase admin, OpenAI, database URLs).'
      - 'The built output: search dist/, build/ and .next/static for key prefixes such as sk_live, service_role, AKIA, -----BEGIN.'
      - Third-party keys that must be public (Stripe pk_, Maps, analytics) and whether they are restricted by domain in the provider's console.
    fail_if: A secret (anything that grants server-side access or costs money without further limits) is in frontend code, a public env variable or the built bundle.
    pass_if: Only publishable keys reach the client, each restricted by domain or app id, and secret calls go through your backend.
    evidence: The list of public env variables and a search of the built bundle.
    fix: Move the call to the backend, rotate the exposed key, and restrict publishable keys by domain.
    source_url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    automated_by: [exposed-paths]

  - id: secrets-management
    title: Production secrets come from a secret store, differ per environment, and can be rotated
    severity: medium
    why: Shared or long-lived secrets turn one leak (a staging box, a CI log, a Docker image) into a production breach, and secrets nobody knows how to rotate stay leaked.
    look_for:
      - 'Where production reads secrets: a secret manager (AWS Secrets Manager or SSM, Vault, GCP Secret Manager), the platform''s encrypted variables, or files on disk.'
      - The same values in development, staging and production.
      - 'Secrets baked into images: ARG or ENV with secrets in Dockerfiles, COPY .env, secrets printed in CI (echo, set -x, debug logging).'
    fail_if: Production secrets are shared with other environments, baked into images, or printed in logs, or there is no way to rotate them.
    pass_if: Each environment has its own secrets from a secret store, images contain none, and rotation is documented.
    evidence: Where each production secret comes from, and the Dockerfile and CI steps reviewed.
    fix: Use a secret store per environment, pass build-time secrets with BuildKit secret mounts, mask secrets in CI, and write down how to rotate each one.
    source_url: https://docs.docker.com/build/building/secrets/

  - id: secrets-debug-off
    title: Debug mode and development tools are off in production
    severity: high
    why: Debug pages show source code, environment variables and stack traces, and some (Werkzeug debugger, Rails web console) run code. Development servers are not built to face the internet.
    look_for:
      - 'Django DEBUG = True, Flask debug=True / FLASK_DEBUG, Laravel APP_DEBUG=true, Spring devtools or debug profiles, Rails consider_all_requests_local, NODE_ENV not set to production.'
      - 'Development servers used in production: next dev, vite dev, nodemon, flask run, python manage.py runserver.'
      - Source maps shipped to production (the scan checks whether they are served).
    fail_if: Any debug mode or development server is enabled in the production configuration.
    pass_if: Production configuration sets debug off and runs production servers, and this is the default when a variable is missing.
    evidence: The production configuration values and the start command.
    fix: Default to production-safe settings, set debug only in development, and run a production server (node with NODE_ENV=production, gunicorn, uvicorn workers).
    source_url: https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
    automated_by: [exposed-paths, hdr-x-powered-by, hdr-server-version]

  - id: secrets-error-handling
    title: Errors shown to users are generic, with no stack traces or internal details
    severity: medium
    why: Stack traces, SQL errors and file paths tell attackers your framework, versions, table names and where to aim next.
    look_for:
      - 'Error handlers that send err.message, err.stack or the whole error object: res.status(500).json(err), res.send(e), return str(e).'
      - Framework error pages in production (Express default handler without NODE_ENV=production, Whitelabel Error Page, Django technical 500).
      - Validation errors that echo internal field or table names.
    fail_if: A response can include a stack trace, a database error or a server path.
    pass_if: A central error handler logs details on the server and returns a generic message with a request id.
    evidence: file:line of the error handler and an example error response.
    fix: Add one error handler that logs the error with a request id and returns a generic body.
    source_url: https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html

  - id: secrets-logging
    title: Security events are logged, and logs hold no secrets or personal data
    severity: medium
    why: Without logs of logins, failures and admin actions, a breach goes unnoticed for months. Logs full of tokens and passwords become a second place to steal them from.
    look_for:
      - 'What is logged: login success and failure, password changes, access denied, admin actions, with user, time and source IP.'
      - 'What must not be: request bodies logged whole, Authorization and Cookie headers, passwords, tokens, card numbers; redaction settings (pino redact, structlog processors, logback masking).'
      - Where logs go, who can read them, how long they are kept, and whether anything alerts on spikes of failures.
    fail_if: Security events are not logged, or logs contain secrets or full request bodies.
    pass_if: Security events are logged centrally with redaction of secrets and personal data, and repeated failures raise an alert.
    evidence: The logger configuration (file:line) and an example of a logged login failure.
    fix: Log security events through one helper, redact sensitive fields, ship logs off the server, and alert on failure spikes.
    source_url: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html

  - id: secrets-tls-verification
    title: Connections from the app verify TLS certificates
    severity: high
    why: Turning off certificate checks (often "temporarily") lets anyone on the network path read and change traffic to your database, payment provider or internal services.
    look_for:
      - 'rejectUnauthorized: false, NODE_TLS_REJECT_UNAUTHORIZED=0, verify=False in Python requests, InsecureSkipVerify: true in Go, curl -k / --insecure in scripts, trust-all managers in Java.'
      - 'Database connections: sslmode=disable or require without verify-full, ssl: { rejectUnauthorized: false } in pg or TypeORM.'
      - Calls to internal services and third parties over plain http://.
    fail_if: Any production connection disables certificate verification or uses plain HTTP across a network.
    pass_if: All outbound connections use TLS with verification, with the provider's CA bundle configured where needed.
    evidence: A search for the patterns above, with file:line of any hits and why each is safe.
    fix: Remove verification overrides and configure the right CA (for example the RDS CA bundle) instead.
    source_url: https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html

  - id: secrets-security-contact
    title: People know how to report a vulnerability to you
    severity: low
    why: Researchers who find a hole need a way to tell you before attackers use it. Without one, reports get lost or go public.
    look_for:
      - A SECURITY.md in the repository with a contact and what to expect.
      - A /.well-known/security.txt on the website with a Contact line and an Expires date.
    fail_if: There is no published way to report a vulnerability.
    pass_if: SECURITY.md and security.txt exist and the contact is monitored.
    evidence: The two files and who reads the contact address.
    fix: Add SECURITY.md and /.well-known/security.txt with a monitored address.
    source_url: https://docs.github.com/en/code-security/getting-started/adding-a-security-policy-to-your-repository
