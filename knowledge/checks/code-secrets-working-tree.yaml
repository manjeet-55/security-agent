id: code-secrets-working-tree
type: code_secrets
title: No secrets in the project's source files
severity: high
applies_to: [code]
params:
  rule: working_tree
fix_hints:
  any: 'Rotate every credential reported here (a value in a repository is already exposed), load it from the environment or a secrets manager instead, and add the file to .gitignore if it must stay local. Mark a deliberate sample with "secagent:ignore" on its line.'
source_url: https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
added_by: seed
review: approved
