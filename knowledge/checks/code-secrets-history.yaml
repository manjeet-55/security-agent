id: code-secrets-history
type: code_secrets
title: No secrets in the git history
why: 'Deleting a secret from the code does not delete it from git history. Anyone with a copy of the repository can still find it and use it.'
severity: high
applies_to: [code]
params:
  rule: history
fix_hints:
  any: 'Rotate the credential: removing it from the tree does not remove it from history, and anyone who cloned the repository already has it. Rewriting history (git filter-repo) only helps after the credential is dead. A shallow or partial clone cannot be fully checked: fetch the full history first.'
source_url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository
added_by: seed
review: approved
